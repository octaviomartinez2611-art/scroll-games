[build]
  publish = "public"
  command = "echo listo"

[functions]
  node_bundler = "esbuild"
  # web-push es CommonJS y usa require() de Node: se deja como módulo aparte, sin empaquetar
  external_node_modules = ["web-push"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
