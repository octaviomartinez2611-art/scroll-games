<title>Swipe Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700&display=swap">
<style>
/* Layout: black phone-width column. Games feed with a right-side action rail (like, save, send, help) above a 3-tab bar. */
:root {
  --ink: #000;
  --panel: #121212;
  --panel2: #1c1c1c;
  --paper: #fff;
  --dim: rgba(255, 255, 255, 0.64);
  --line: rgba(255, 255, 255, 0.12);
  --brand: #fe2c55;
  --gold: #ffd23f;
  --card: rgba(0, 0, 0, 0.88);
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden;
  display: flex; justify-content: center;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { width: min(100%, 480px); height: 100%; display: flex; flex-direction: column; background: var(--ink); }
.views { position: relative; flex: 1; min-height: 0; }

/* ---- feed ---- */
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y; }
.feed::-webkit-scrollbar { display: none; }
.slide {
  position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden;
  background: #000 radial-gradient(rgba(255, 255, 255, 0.06) 1.2px, transparent 1.7px) 0 0 / 26px 26px;
  contain: layout paint;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none;
}
.hearts { display: flex; gap: 4px; padding-top: 6px; }
.hearts svg { width: 22px; height: 22px; fill: var(--brand); stroke: var(--brand); stroke-width: 2; }
.hearts svg.off { fill: none; stroke: rgba(255, 255, 255, 0.35); }
.hud .c { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.score { font: 800 64px/0.95 var(--display); font-variant-numeric: tabular-nums; }
.best { font: 700 11px/1 var(--body); letter-spacing: 0.12em; color: var(--dim); font-variant-numeric: tabular-nums; }
.cap {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; pointer-events: none;
  display: flex; flex-direction: column; gap: 3px; max-width: 60%;
}
.cap b { font: 800 19px/1.1 var(--display); text-shadow: 0 1px 8px #000; }
.cap span { font: 500 13px/1.2 var(--body); color: var(--dim); }

.topr { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
.coins { display: flex; align-items: center; gap: 7px; padding: 7px 12px 7px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); font: 800 14px/1 var(--display); font-variant-numeric: tabular-nums; }
.coin { width: 18px; height: 18px; border-radius: 50%; display: inline-block; flex: none; background: radial-gradient(circle at 35% 30%, #fff1a8, #ffc21a 60%, #d98a0b); box-shadow: inset 0 0 0 2px rgba(120, 70, 0, 0.35); }

.rail {
  position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); bottom: 14px; z-index: 5;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
.rail button { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 52px; padding: 4px 0; }
.rail svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6)); }
.rail span { font: 700 11px/1 var(--body); text-shadow: 0 1px 4px #000; }
.rail .on svg { fill: var(--brand); stroke: var(--brand); }
.rail #rSave.on svg { fill: var(--gold); stroke: var(--gold); }
.rail #rLike.pulse svg { animation: pulse 0.3s ease-out; }
@keyframes pulse { 50% { transform: scale(1.3); } }

.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 12; padding: 11px 16px; border-radius: 999px; background: #fff; color: #000; font: 700 14px/1 var(--body); white-space: nowrap; pointer-events: none; animation: rise 0.2s ease-out; }

/* ---- result strip ---- */
.strip {
  position: absolute; left: 12px; right: 12px; top: 124px; z-index: 4; padding: 14px 16px 16px; border-radius: 22px;
  background: var(--card); border: 1px solid var(--line); pointer-events: none;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden; animation: rise 0.25s ease-out;
}
.strip .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.strip h3 { font: 800 22px/1.1 var(--display); }
.strip p { font: 500 13px/1.3 var(--body); color: var(--dim); }
.rew { display: flex; align-items: center; gap: 6px; font: 800 15px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rew .sep { opacity: 0.4; padding: 0 2px; }
.xp { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--gold)); transition: width 0.9s cubic-bezier(.2, .8, .2, 1); }
.xp > span { font: 800 12px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; min-width: 64px; text-align: right; }
.xp > span.up { color: var(--gold); }
.strip .auto { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--brand); transform-origin: left; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }

/* ---- sheets ---- */
.sheet {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(0, 0, 0, 0.7);
}
.sheet .card { width: 100%; max-height: 80%; overflow-y: auto; background: var(--panel); border-radius: 26px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.sheet h2 { font: 800 26px/1.05 var(--display); }
.sheet p { font: 500 18px/1.4 var(--body); text-wrap: balance; }
.btn { align-self: stretch; border-radius: 16px; padding: 14px 16px; background: var(--brand); color: #fff; font: 800 15px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.btn.ghost { background: var(--panel2); }
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--panel2); text-align: left; width: 100%; font: 700 16px/1.2 var(--body); }
.pick .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--a, #fff); }
.pick small { margin-left: auto; color: var(--dim); font: 700 12px/1 var(--body); }

/* ---- panels ---- */
.panel { position: absolute; inset: 0; z-index: 6; overflow-y: auto; background: var(--ink); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.panel > * { flex: none; }
.panel h1 { font: 800 28px/1.05 var(--display); }
.note { font: 500 13px/1.4 var(--body); color: var(--dim); }
.addrow { display: flex; gap: 8px; }
.addrow input, .chatform input { flex: 1; min-width: 0; background: var(--panel2); border: 0; border-radius: 14px; padding: 13px 14px; color: #fff; font: 500 16px/1.2 var(--body); user-select: text; -webkit-user-select: text; }
.addrow input::placeholder, .chatform input::placeholder { color: rgba(255, 255, 255, 0.45); }
.addrow input:focus, .chatform input:focus { outline: 2px solid var(--brand); }
.addrow .btn { align-self: auto; padding: 0 18px; }
.flist { display: flex; flex-direction: column; }
.frow { display: flex; align-items: center; gap: 12px; padding: 12px 2px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.av { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 20px/1 var(--display); color: #000; background: hsl(var(--h, 340), 85%, 62%); }
.frow div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.frow b { font: 800 16px/1.1 var(--body); }
.frow span { font: 500 13px/1.2 var(--body); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 28px 12px; text-align: center; font: 500 15px/1.5 var(--body); color: var(--dim); text-wrap: balance; }

/* chat */
.chathead { display: flex; align-items: center; gap: 10px; }
.chathead .back { width: 40px; height: 40px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; flex: none; }
.chathead svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chathead b { flex: 1; min-width: 0; font: 800 20px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; }
.chathead .rm { font: 700 12px/1 var(--body); color: var(--dim); padding: 10px; }
.msgs { flex: 1 1 auto !important; min-height: 120px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 6px 0; }
.bub { align-self: flex-end; max-width: 80%; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: var(--brand); font: 500 16px/1.35 var(--body); overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.gcard { align-self: flex-end; width: 220px; border-radius: 18px; background: var(--panel2); padding: 14px; display: flex; flex-direction: column; gap: 10px; border-left: 5px solid var(--a, #fff); }
.gcard b { font: 800 19px/1.1 var(--display); }
.gcard span { font: 500 13px/1.2 var(--body); color: var(--dim); }
.gcard button { background: #fff; color: #000; border-radius: 12px; padding: 10px; font: 800 13px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.chatform { display: flex; gap: 8px; align-items: center; }
.chatform .round { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--panel2); font: 800 22px/1 var(--display); }
.chatform .send { background: var(--brand); border-radius: 14px; padding: 0 16px; height: 46px; font: 800 14px/1 var(--display); }
#pChat { padding-bottom: 14px; }

/* profile */
.pf { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; }
.pf .avatar { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font: 800 40px/1 var(--display); color: #000; background: radial-gradient(circle at 30% 25%, #fff1a8, var(--gold) 55%, #f08a1b); }
.pf input { width: 70%; text-align: center; background: transparent; border: 0; border-bottom: 2px solid var(--line); color: #fff; font: 800 22px/1.2 var(--display); padding: 2px 0 4px; user-select: text; -webkit-user-select: text; }
.pf input:focus { outline: none; border-bottom-color: var(--brand); }
.lvlchip { font: 800 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; background: var(--panel2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: 700 11px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); text-align: center; }
.lvlbar { display: flex; flex-direction: column; gap: 6px; }
.lvlbar .track { flex: none; }
.lvlbar .track i { transition: none; }
.lvlbar small { font: 700 12px/1 var(--body); color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
.tabs2 { display: flex; border-bottom: 1px solid var(--line); }
.tabs2 button { flex: 1; padding: 12px 0; font: 800 14px/1 var(--display); color: var(--dim); border-bottom: 3px solid transparent; }
.tabs2 button[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { aspect-ratio: 3 / 4; border-radius: 14px; background: var(--panel); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 10px; text-align: left; border: 1px solid var(--line); }
.tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--a, #fff); }
.tile b { font: 800 15px/1.1 var(--display); }
.toggle { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border-radius: 16px; padding: 14px 16px; font: 700 15px/1 var(--body); width: 100%; }
.toggle em { font: 800 12px/1 var(--display); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; background: var(--brand); color: #fff; }
.toggle[aria-pressed="false"] em { background: var(--panel2); color: var(--dim); }

/* ---- tab bar ---- */
.bar { display: flex; gap: 6px; flex: none; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: #000; border-top: 1px solid var(--line); }
.tab { flex: 1; min-height: 52px; border-radius: 14px; color: var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 700 11px/1 var(--body); }
.tab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: #fff; }
.tab[aria-current="page"] svg { fill: #fff; }
@media (prefers-reduced-motion: reduce) { .strip, .toast { animation: none; } .track i { transition: none; } .rail #rLike.pulse svg { animation: none; } }
</style>

<div class="app">
  <div class="views" id="views">
    <main class="feed" id="feed" aria-label="Feed de minijuegos"></main>

    <div class="topr" id="topr"><span class="coins"><span class="coin"></span><span id="coinsN">0</span></span></div>

    <div class="rail" id="rail">
      <button id="rLike" aria-label="Me gusta"><svg viewBox="0 0 24 24"><path d="M12 21C12 21 3 15.5 3 9.2C3 6.3 5.2 4.5 7.6 4.5C9.5 4.5 11.1 5.6 12 7.2C12.9 5.6 14.5 4.5 16.4 4.5C18.8 4.5 21 6.3 21 9.2C21 15.5 12 21 12 21Z"/></svg><span>Like</span></button>
      <button id="rSave" aria-label="Guardar"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg><span>Guardar</span></button>
      <button id="rSend" aria-label="Enviar a un amigo"><svg viewBox="0 0 24 24"><path d="M21 3.5L10.5 14M21 3.5l-6.5 17-4-6.5-6.5-4z"/></svg><span>Enviar</span></button>
      <button id="rHelp" aria-label="Cómo se juega"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.1.9-1.1 1.7M12 17h.01"/></svg><span>Cómo</span></button>
    </div>

    <div class="strip" id="strip" hidden>
      <div class="row">
        <div><h3 id="sTitle"></h3><p id="sSub"></p></div>
        <div class="rew"><span>+<span id="sXp">0</span> XP</span><span class="sep">·</span><span class="coin"></span><span>+<span id="sCoin">0</span></span></div>
      </div>
      <div class="xp"><div class="track"><i id="sBar"></i></div><span id="sLvl"></span></div>
      <i class="auto" id="sAuto"></i>
    </div>

    <section class="panel" id="pFriends" hidden aria-label="Amigos">
      <h1>Amigos</h1>
      <form class="addrow" id="addForm"><input id="addIn" maxlength="16" placeholder="Nombre de usuario" autocomplete="off" aria-label="Nombre de usuario del amigo"><button class="btn" type="submit">Agregar</button></form>
      <p class="note">Prototipo: tus amigos y mensajes se guardan solo en este dispositivo. Todavía no hay envío real entre personas.</p>
      <div class="flist" id="flist"></div>
    </section>

    <section class="panel" id="pChat" hidden aria-label="Chat">
      <div class="chathead"><button class="back" id="chatBack" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b id="chatName"></b><button class="rm" id="chatRm">Quitar</button></div>
      <div class="msgs" id="msgs"></div>
      <form class="chatform" id="chatForm"><button class="round" type="button" id="chatGame" aria-label="Enviar un juego">+</button><input id="chatIn" placeholder="Mensaje" maxlength="300" autocomplete="off" aria-label="Mensaje"><button class="send" type="submit">Enviar</button></form>
    </section>

    <section class="panel" id="pProfile" hidden aria-label="Perfil">
      <div class="pf">
        <div class="avatar" id="avatar">J</div>
        <input id="nameIn" maxlength="16" aria-label="Tu nombre" autocomplete="off">
        <span class="lvlchip" id="pLvl">Nivel 1</span>
      </div>
      <div class="stats">
        <div class="stat"><b id="stPlays">0</b><span>Partidas</span></div>
        <div class="stat"><b id="stCoins">0</b><span>Monedas</span></div>
        <div class="stat"><b id="stStreak">1</b><span>Días de racha</span></div>
      </div>
      <div class="lvlbar"><div class="track"><i id="pBar"></i></div><small id="pXp"></small></div>
      <div class="tabs2" role="tablist">
        <button role="tab" id="tabSaved" aria-selected="true">Guardados</button>
        <button role="tab" id="tabLiked" aria-selected="false">Me gusta</button>
      </div>
      <div class="tiles" id="tiles"></div>
      <button class="toggle" id="sndBtn" aria-pressed="true">Sonido <em id="sndState">Sí</em></button>
    </section>

    <div class="sheet" id="sheet" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="shT">
        <h2 id="shT"></h2><p id="shP"></p><button class="btn" id="shOk">Entendido</button>
      </div>
    </div>
    <div class="sheet" id="sendSheet" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="sdT">
        <h2 id="sdT">Enviar a un amigo</h2><div id="sendList" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn ghost" id="sendCancel">Cancelar</button>
      </div>
    </div>
    <div class="sheet" id="pickSheet" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="pkT">
        <h2 id="pkT">Elegí un juego</h2><div id="pickList" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn ghost" id="pickCancel">Cancelar</button>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <nav class="bar" aria-label="Navegación">
    <button class="tab" data-v="play" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Jugar</button>
    <button class="tab" data-v="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17.5 14.5c2.4.2 3.7 1.8 4 4.5"/></svg>Amigos</button>
    <button class="tab" data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>Perfil</button>
  </nav>
</div>

<script>
(function () {
  "use strict";
  var TAU = Math.PI * 2, PI = Math.PI;
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var ri = function (a, b) { return Math.floor(rnd(a, b)); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };
  var DISPLAY = '"Bricolage Grotesque", system-ui, sans-serif';
  var PAL = ["#ff4d6d", "#ffd23f", "#3ddc84", "#ff9f1c", "#c77dff", "#ff5fd2"];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); };

  /* ---------- profile (saved in this browser) ---------- */
  var P = { name: "Jugador", xp: 0, coins: 0, plays: 0, streak: 0, lastDay: "", best: {}, gp: {}, sound: true, likes: {}, saved: {}, friends: [] };
  try {
    var raw = localStorage.getItem("swipe-arcade-v3") || localStorage.getItem("swipe-arcade-v2");
    if (raw) { var o = JSON.parse(raw); for (var pk in o) P[pk] = o[pk]; }
  } catch (e) {}
  function save() { try { localStorage.setItem("swipe-arcade-v3", JSON.stringify(P)); } catch (e) {} }
  function dayStr(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  (function () {
    var n = new Date(), t = dayStr(n);
    if (P.lastDay !== t) { P.streak = (P.lastDay === dayStr(new Date(n.getTime() - 864e5))) ? P.streak + 1 : 1; P.lastDay = t; save(); }
  })();
  function need(l) { return 40 + 20 * (l - 1); }
  function xpInfo(xp) { var l = 1, r = xp; while (r >= need(l)) { r -= need(l); l++; } return { lvl: l, rem: r, need: need(l) }; }

  /* ---------- sound ---------- */
  var AC = null;
  function sfx(f, d, type, vol, slide) {
    if (!P.sound) return;
    try {

    { id: "truth", name: "Verdad", how: "Deslizá a la derecha si la cuenta está bien, a la izquierda si está mal.", accent: "#3ddc84", ctor: Truth },
    { id: "stroop", name: "Colores", how: "Deslizá a la derecha si el color de la letra es el que dice la palabra, a la izquierda si no.", accent: "#c77dff", ctor: Stroop },
    { id: "clock", name: "Cronómetro", how: "Tocá cuando creas que llegó al tiempo pedido. Después se esconde.", accent: "#ff4d6d", ctor: Clock },
    { id: "aim", name: "Puntería", how: "Tocá cuando la mira pase por el centro del blanco.", accent: "#ff4d6d", ctor: Aim },
    { id: "fish", name: "Anzuelo", how: "Arrastrá para mover el bote. Mantené apretado para bajar el anzuelo y soltá para subir. Evitá los erizos.", accent: "#ffd23f", ctor: Fish }
  ];
  var byId = {}; CATALOG.forEach(function (g) { byId[g.id] = g; });
  var NG = CATALOG.length, N = NG * 4;
  var HEART = '<svg viewBox="0 0 24 24"><path d="M12 21C12 21 3 15.5 3 9.2C3 6.3 5.2 4.5 7.6 4.5C9.5 4.5 11.1 5.6 12 7.2C12.9 5.6 14.5 4.5 16.4 4.5C18.8 4.5 21 6.3 21 9.2C21 15.5 12 21 12 21Z"/></svg>';
  var feed = $("feed"), slides = [], cache = {};
  for (var i = 0; i < N; i++) {
    var cfg = CATALOG[(i + Math.floor(i / NG) * 7) % NG];
    var s = document.createElement("section");
    s.className = "slide"; s.dataset.i = i;
    s.innerHTML = '<div class="hud"><span class="hearts">' + HEART + HEART + HEART + '</span><div class="c"><span class="score">0</span><span class="best">MEJOR 0</span></div><div></div></div><div class="cap"><b></b><span>Minijuego</span></div>';
    s.querySelector(".cap b").textContent = cfg.name;
    s.cfg = cfg; feed.appendChild(s); slides.push(s);
  }
  function ensure(i) {
    if (i < 0 || i >= N) return null;
    if (!cache[i]) { var sl = slides[i], cv = document.createElement("canvas"); sl.insertBefore(cv, sl.firstChild); cache[i] = new sl.cfg.ctor(sl, sl.cfg); }
    return cache[i];
  }
  function drop(i) { var g = cache[i]; if (!g) return; g.cv.remove(); delete cache[i]; }
  function firstIndex(id) { for (var k = 0; k < N; k++) if (slides[k].cfg.id === id) return k; return 0; }
  function activeIdx() { return Math.round(feed.scrollTop / (feed.clientHeight || 1)); }
  function activeGame() { return cache[activeIdx()]; }

  /* ---------- UI: views, rail, friends, chat, profile ---------- */
  var view = "play", paused = false, lastAct = -1, chatId = null, toastT = 0, profTab = "saved";
  var strip = $("strip");
  function coinsUI() { $("coinsN").textContent = P.coins; }
  coinsUI();
  function toast(m) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 1800); }
  function closeSheets() { $("sheet").hidden = true; $("sendSheet").hidden = true; $("pickSheet").hidden = true; paused = false; }

  function setView(v) {
    view = v;
    $("pFriends").hidden = v !== "friends"; $("pChat").hidden = v !== "chat"; $("pProfile").hidden = v !== "profile";
    $("topr").hidden = v !== "play"; $("rail").hidden = v !== "play";
    var tv = v === "chat" ? "friends" : v, tabs = document.querySelectorAll(".tab");
    for (var k = 0; k < tabs.length; k++) { if (tabs[k].dataset.v === tv) tabs[k].setAttribute("aria-current", "page"); else tabs[k].removeAttribute("aria-current"); }

  }
  var tabEls = document.querySelectorAll(".tab");
  for (var ti = 0; ti < tabEls.length; ti++) tabEls[ti].addEventListener("click", function () { setView(this.dataset.v); });
  function goTo(id) { setView("play"); feed.scrollTop = firstIndex(id) * feed.clientHeight; }

  /* rail */
  function syncRail() {
    var sl = slides[clamp(activeIdx(), 0, N - 1)], id = sl.cfg.id;
    $("rLike").classList.toggle("on", !!P.likes[id]); $("rSave").classList.toggle("on", !!P.saved[id]);
  }
  $("rLike").addEventListener("click", function () {
    var id = slides[activeIdx()].cfg.id; if (P.likes[id]) delete P.likes[id]; else { P.likes[id] = 1; this.classList.remove("pulse"); void this.offsetWidth; this.classList.add("pulse"); sfx(700, 0.1, "triangle", 0.06); }
    save(); syncRail();
  });
  $("rSave").addEventListener("click", function () {
    var id = slides[activeIdx()].cfg.id; if (P.saved[id]) { delete P.saved[id]; toast("Quitado de guardados"); } else { P.saved[id] = 1; toast("Guardado en tu perfil"); }
    save(); syncRail();
  });
  $("rHelp").addEventListener("click", function () {
    var sl = slides[activeIdx()]; $("shT").textContent = sl.cfg.name; $("shP").textContent = sl.cfg.how; $("sheet").hidden = false; paused = true;
  });
  $("shOk").addEventListener("click", closeSheets);
  $("rSend").addEventListener("click", function () {
    var list = $("sendList"), id = slides[activeIdx()].cfg.id; list.innerHTML = "";
    if (!P.friends.length) {
      var p = document.createElement("p"); p.textContent = "Todavía no tenés amigos. Agregá a alguien para enviarle juegos."; list.appendChild(p);
      var b = document.createElement("button"); b.className = "btn"; b.textContent = "Agregar amigos"; b.onclick = function () { setView("friends"); }; list.appendChild(b);
    } else P.friends.forEach(function (f) {
      var b = document.createElement("button"); b.className = "pick"; b.innerHTML = '<span class="av" style="--h:' + f.h + ';width:36px;height:36px;font-size:16px">' + esc(f.name[0].toUpperCase()) + '</span>' + esc(f.name);
      b.onclick = function () { sendGame(f.id, id); closeSheets(); toast("Enviado a " + f.name); }; list.appendChild(b);
    });
    $("sendSheet").hidden = false; paused = true;
  });
  $("sendCancel").addEventListener("click", closeSheets);

  /* friends */
  function hueOf(s) { var h = 0; for (var k = 0; k < s.length; k++) h = (h * 31 + s.charCodeAt(k)) % 360; return h; }
  function friendById(id) { for (var k = 0; k < P.friends.length; k++) if (P.friends[k].id === id) return P.friends[k]; return null; }
  function renderFriends() {
    var l = $("flist"); l.innerHTML = "";
    if (!P.friends.length) { var e = document.createElement("p"); e.className = "empty"; e.textContent = "Todavía no agregaste a nadie. Escribí un nombre de usuario arriba y tocá Agregar."; l.appendChild(e); return; }
    P.friends.forEach(function (f) {
      var last = f.msgs.length ? f.msgs[f.msgs.length - 1] : null, b = document.createElement("button"); b.className = "frow";
      var prev = last ? (last.game ? "Juego: " + (byId[last.game] ? byId[last.game].name : "") : last.text) : "Tocá para chatear";
      b.innerHTML = '<span class="av" style="--h:' + f.h + '">' + esc(f.name[0].toUpperCase()) + '</span><div><b>' + esc(f.name) + '</b><span>' + esc(prev) + '</span></div>';
      b.onclick = function () { chatId = f.id; setView("chat"); }; l.appendChild(b);
    });
  }
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault(); var n = $("addIn").value.trim().replace(/^@/, "");
    if (!n) return; if (P.friends.some(function (f) { return f.name.toLowerCase() === n.toLowerCase(); })) { toast("Ya es tu amigo"); return; }
    if (P.friends.length >= 30) { toast("Llegaste al máximo de amigos"); return; }
    P.friends.push({ id: "f" + Date.now(), name: n, h: hueOf(n), msgs: [] }); save(); $("addIn").value = ""; renderFriends(); toast(n + " agregado");
  });
  function sendGame(fid, gid) { var f = friendById(fid); if (!f) return; f.msgs.push({ game: gid, t: Date.now() }); save(); }
  function renderChat() {
    var f = friendById(chatId); if (!f) { setView("friends"); return; }
    $("chatName").textContent = f.name; var m = $("msgs"); m.innerHTML = "";
    if (!f.msgs.length) { var e = document.createElement("p"); e.className = "empty"; e.textContent = "Escribí un mensaje o mandale un juego con el botón +."; m.appendChild(e); }
    f.msgs.forEach(function (x) {
      if (x.game && byId[x.game]) {
        var g = byId[x.game], d = document.createElement("div"); d.className = "gcard"; d.style.setProperty("--a", g.accent);
        d.innerHTML = '<b>' + esc(g.name) + '</b><span>Te envié este juego</span>'; var b = document.createElement("button"); b.textContent = "Jugar"; b.onclick = function () { goTo(g.id); }; d.appendChild(b); m.appendChild(d);
      } else { var bu = document.createElement("div"); bu.className = "bub"; bu.textContent = x.text; m.appendChild(bu); }
    });
    m.scrollTop = m.scrollHeight;
  }
  $("chatBack").addEventListener("click", function () { setView("friends"); });
  $("chatRm").addEventListener("click", function () { P.friends = P.friends.filter(function (f) { return f.id !== chatId; }); save(); setView("friends"); });
  $("chatForm").addEventListener("submit", function (e) {
    e.preventDefault(); var f = friendById(chatId), t = $("chatIn").value.trim(); if (!f || !t) return;
    f.msgs.push({ text: t, t: Date.now() }); save(); $("chatIn").value = ""; renderChat();
  });
  $("chatGame").addEventListener("click", function () {
    var l = $("pickList"); l.innerHTML = "";
    CATALOG.forEach(function (g) {
      var b = document.createElement("button"); b.className = "pick"; b.style.setProperty("--a", g.accent); b.innerHTML = '<i class="dot"></i>' + esc(g.name);
      b.onclick = function () { sendGame(chatId, g.id); closeSheets(); renderChat(); }; l.appendChild(b);
    });
    $("pickSheet").hidden = false;
  });
  $("pickCancel").addEventListener("click", closeSheets);

  /* profile */
  function renderProfile() {
    var inf = xpInfo(P.xp);
    $("nameIn").value = P.name; $("avatar").textContent = (P.name.trim()[0] || "J").toUpperCase();
    $("pLvl").textContent = "Nivel " + inf.lvl; $("pXp").textContent = inf.rem + " / " + inf.need + " XP";
    $("pBar").style.width = Math.round(inf.rem / inf.need * 100) + "%";
    $("stPlays").textContent = P.plays; $("stCoins").textContent = P.coins; $("stStreak").textContent = P.streak;
    $("sndBtn").setAttribute("aria-pressed", String(P.sound)); $("sndState").textContent = P.sound ? "Sí" : "No";
    $("tabSaved").setAttribute("aria-selected", String(profTab === "saved")); $("tabLiked").setAttribute("aria-selected", String(profTab === "liked"));
    var set = profTab === "saved" ? P.saved : P.likes, t = $("tiles"); t.innerHTML = "";
    var ids = CATALOG.filter(function (g) { return set[g.id]; });
    if (!ids.length) { var e = document.createElement("p"); e.className = "empty"; e.style.gridColumn = "1 / -1"; e.textContent = profTab === "saved" ? "Guardá juegos con el marcador del feed y aparecen acá." : "Tocá el corazón en un juego y aparece acá."; t.appendChild(e); return; }
    ids.forEach(function (g) { var b = document.createElement("button"); b.className = "tile"; b.style.setProperty("--a", g.accent); b.innerHTML = "<b>" + esc(g.name) + "</b>"; b.onclick = function () { goTo(g.id); }; t.appendChild(b); });
  }
  $("tabSaved").addEventListener("click", function () { profTab = "saved"; renderProfile(); });
  $("tabLiked").addEventListener("click", function () { profTab = "liked"; renderProfile(); });
  $("nameIn").addEventListener("input", function () { P.name = this.value.slice(0, 16); $("avatar").textContent = (P.name.trim()[0] || "J").toUpperCase(); save(); });
  $("sndBtn").addEventListener("click", function () { P.sound = !P.sound; save(); renderProfile(); if (P.sound) S.hit(3); });

  /* result strip */
  UI.onEnd = function (g) {
    var r = g.result, pct = function (x) { return Math.round(x.rem / x.need * 100) + "%"; };
    var near = !g.newBest && g.best > 0 && g.score >= g.best * 0.8;
    $("sTitle").textContent = (g.newBest && g.score > 0) ? "¡Récord nuevo!" : near ? "¡Casi tu récord!" : "Sumaste progreso";
    $("sSub").textContent = g.score + (g.score === 1 ? " punto" : " puntos") + " · mejor " + g.best;
    $("sXp").textContent = r.xp; $("sCoin").textContent = r.coins;
    var bar = $("sBar"), lv = $("sLvl");
    bar.style.transition = "none"; bar.style.width = r.lvlUp ? "0%" : pct(r.before); void bar.offsetWidth; bar.style.transition = ""; bar.style.width = pct(r.after);
    lv.textContent = r.lvlUp ? "¡Nivel " + r.after.lvl + "!" : "Nivel " + r.after.lvl; lv.className = r.lvlUp ? "up" : "";
    coinsUI();
  };

  /* ---------- input: tap, drag, hold and swipe ---------- */
  var down = null;
  function local(sec, e) { var r = sec.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function gameOf(sec) { return sec ? cache[+sec.dataset.i] : null; }
  feed.addEventListener("pointerdown", function (e) {
    var sec = e.target.closest(".slide"); down = { id: e.pointerId, x: e.clientX, y: e.clientY, sec: sec };
    if (view !== "play" || paused) return;
    var g = gameOf(sec);
    if (g && (g.ctl === "drag" || g.ctl === "hold") && g.state === "play") { var p = local(sec, e); g.pdown(p.x, p.y); }
  });
  feed.addEventListener("pointermove", function (e) {
    if (!down || down.id !== e.pointerId || !down.sec) return;
    var g = gameOf(down.sec); if (g && g.holding) { var p = local(down.sec, e); g.pmove(p.x, p.y); }
  });
  window.addEventListener("pointercancel", function () {
    if (down && down.sec) { var g = gameOf(down.sec); if (g && g.holding) g.pup(0, 0, true); } down = null;
  });
  window.addEventListener("pointerup", function (e) {
    var d = down; down = null;
    if (!d || d.id !== e.pointerId) return;
    if (AC && AC.state === "suspended") { try { AC.resume(); } catch (er) {} }
    if (view !== "play" || paused || !d.sec) return;
    var g = gameOf(d.sec); if (!g) return;
    var p = local(d.sec, e), dx = e.clientX - d.x, dy = e.clientY - d.y, moved = Math.hypot(dx, dy);
    if (g.state === "over") { if (moved <= 12) g.tap(p.x, p.y); return; }
    if (g.ctl === "drag" || g.ctl === "hold") { g.pup(p.x, p.y, false); return; }
    if (g.ctl === "swipe" && Math.abs(dx) > 40 && Math.abs(dy) < 70) { g.act(dx < 0 ? 1 : g.W - 1, p.y); return; }
    if (moved > 12) return;
    g.tap(p.x, p.y);
  });
  window.addEventListener("keydown", function (e) {
    if (view !== "play" || paused) return;
    var h = feed.clientHeight, g;
    if (e.key === "ArrowDown") { e.preventDefault(); feed.scrollBy({ top: h, behavior: "smooth" }); }
    else if (e.key === "ArrowUp") { e.preventDefault(); feed.scrollBy({ top: -h, behavior: "smooth" }); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); g = activeGame(); if (!g) return; if (g.ctl === "hold" && g.state === "play") { if (!g.holding) g.pdown(g.W / 2, g.H / 2); } else g.tap(g.W / 2, g.H / 2); }
    else if (e.key === "ArrowLeft") { g = activeGame(); if (g) g.tap(1, g.H / 2); }
    else if (e.key === "ArrowRight") { g = activeGame(); if (g) g.tap(g.W - 1, g.H / 2); }
  });
  window.addEventListener("keyup", function (e) { if (e.key === " ") { var g = activeGame(); if (g && g.ctl === "hold") g.pup(0, 0, false); } });
  window.addEventListener("resize", function () { for (var k in cache) { cache[k].resize(); cache[k].reset(); } });

  /* ---------- main loop ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (view !== "play") { requestAnimationFrame(frame); return; }
    var h = feed.clientHeight || 1, pos = feed.scrollTop / h;
    var lo = Math.floor(pos + 0.001), hi = Math.ceil(pos - 0.001), act = Math.round(pos);
    var vis = lo === hi ? [lo] : [lo, hi], j, g, running = !paused;
    if (act !== lastAct) { lastAct = act; syncRail(); }
    for (j = 0; j < vis.length; j++) {
      g = ensure(vis[j]); if (!g) continue;
      if (vis[j] === act && running) {
        if (g.state === "ready") g.begin();
        if (g.state === "over" && now > g.restartAt) { g.reset(); g.begin(); }
        g.tick(dt); g.render(now); g.drawn = true;
      } else if (!g.drawn) { g.render(now); g.drawn = true; }
    }
    for (var k in cache) {
      var kk = +k;
      if (kk < lo || kk > hi) { if (cache[k].state !== "ready") cache[k].reset(); if (Math.abs(kk - act) > 2) drop(kk); }
    }
    var ag = cache[act], show = !!ag && ag.state === "over";
    if (show) $("sAuto").style.transform = "scaleX(" + clamp((ag.restartAt - now) / 2800, 0, 1) + ")";
    if (show !== !strip.hidden) strip.hidden = !show;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
