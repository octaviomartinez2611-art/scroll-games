<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Swipe Arcade</title>
<style>
/* Layout: black phone-width column. Games feed with a right-side action rail (like, save, send, help) above a 3-tab bar. */
:root {
  --ink: #000;
  --panel: #121212;
  --panel2: #1c1c1c;
  --paper: #fff;
  --dim: rgba(255, 255, 255, 0.64);
  --line: rgba(255, 255, 255, 0.12);
  --brand: #fe2c55;
  --gold: #ffd23f;
  --card: rgba(0, 0, 0, 0.88);
  --display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { height: 100dvh; }
body {
  background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden;
  display: flex; justify-content: center;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { width: min(100%, 480px); height: 100%; display: flex; flex-direction: column; background: var(--ink); }
.views { position: relative; flex: 1; min-height: 0; }

/* ---- feed ---- */
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y; }
.feed::-webkit-scrollbar { display: none; }
.slide {
  position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden;
  background: #000;
  contain: layout paint;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none;
}
.hearts { display: flex; gap: 4px; padding-top: 4px; }
.hud .l { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gname { font: 600 13px/1.15 var(--body); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.hearts svg { width: 18px; height: 18px; fill: var(--brand); stroke: var(--brand); stroke-width: 2; }
.hearts svg.off { fill: none; stroke: rgba(255, 255, 255, 0.35); }
.hud .c { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.score { font: 600 40px/0.95 var(--display); font-variant-numeric: tabular-nums; }
.best { font: 700 11px/1 var(--body);  color: var(--dim); font-variant-numeric: tabular-nums; }
.cap {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; pointer-events: none;
  display: flex; flex-direction: column; gap: 3px; max-width: 60%;
}
.cap b { font: 600 16px/1.1 var(--display);  }
.cap span { font: 500 13px/1.2 var(--body); color: var(--dim); }

.topr { display: flex; gap: 8px; align-items: center; position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
.coins { display: flex; align-items: center; gap: 7px; padding: 7px 12px 7px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; }
.coin { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: none; background: #ffc21a; }

.rail {
  transition: opacity 0.25s;
  position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); bottom: 14px; z-index: 5;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
.rail button { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 52px; padding: 4px 0; }
.rail svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rail span { display: none; }
.rail .on svg { fill: var(--brand); stroke: var(--brand); }
.rail #rSave.on svg { fill: var(--gold); stroke: var(--gold); }

.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 12; padding: 11px 16px; border-radius: 999px; background: #fff; color: #000; font: 700 14px/1 var(--body); white-space: nowrap; pointer-events: none; }

/* ---- result strip ---- */
.strip {
  position: absolute; left: 12px; right: 12px; top: 124px; z-index: 4; padding: 14px 16px 16px; border-radius: 22px;
  background: var(--card); border: 1px solid var(--line); pointer-events: none;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
}
.strip .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.strip h3 { font: 700 22px/1.1 var(--display); }
.strip p { font: 500 13px/1.3 var(--body); color: var(--dim); }
.rew { display: flex; align-items: center; gap: 6px; font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rew .sep { opacity: 0.4; padding: 0 2px; }
.xp { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--brand); }
.xp > span { font: 700 12px/1 var(--display);   min-width: 64px; text-align: right; }
.xp > span.up { color: var(--gold); }
.strip .auto { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--brand); transform-origin: left; }

.rail button { transition: opacity 0.25s; }
.rail.busy button:not(.spd) { opacity: 0; pointer-events: none; }
.snd { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: grid; place-items: center; }
.snd svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.snd .x { display: none; }
.snd.off .x { display: inline; } .snd.off .w { display: none; }
.rail .spd { width: 46px; height: 46px; padding: 0; justify-content: center; border-radius: 50%; font: 700 17px/1 var(--body); color: #fff; background: rgba(255, 255, 255, 0.16); }
.rail .spd[aria-pressed="true"] { color: #000; background: #fff; }
.login { position: fixed; inset: 0; z-index: 30; background: #000; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.lgbox { width: min(100%, 380px); display: flex; flex-direction: column; gap: 14px; }
.lgbox h1 { font: 700 34px/1.05 var(--display); }
.lgbox form { display: flex; flex-direction: column; gap: 10px; }
.lgbox input { background: var(--panel2); border: 0; border-radius: 14px; padding: 15px 14px; color: #fff; font: 500 17px/1.2 var(--body); user-select: text; -webkit-user-select: text; }
.lgbox input:focus { outline: 2px solid var(--brand); }
.lgerr { min-height: 18px; color: #ff6b81; font: 600 14px/1.3 var(--body); }
.lgskip { color: var(--dim); font: 600 14px/1 var(--body); padding: 10px; }
.acct { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border-radius: 16px; padding: 14px 16px; font: 600 15px/1 var(--body); }
.acct button { color: #ff6b81; font: 700 14px/1 var(--body); }
.adm { display: flex; flex-direction: column; gap: 8px; }
.adm h2 { font: 700 18px/1.1 var(--display); padding-top: 6px; }
.adm .rep { background: var(--panel); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font: 500 14px/1.35 var(--body); overflow-wrap: anywhere; }
.adm .rep small { color: var(--dim); }
.adm .row { display: flex; gap: 8px; }
.adm .row button { flex: 1; padding: 10px; border-radius: 12px; background: var(--panel2); font: 700 13px/1 var(--body); }
.adm .row button.del { background: var(--brand); }
.adm form { display: flex; gap: 8px; }
.adm input { flex: 1; min-width: 0; background: var(--panel2); border: 0; border-radius: 12px; padding: 11px 12px; color: #fff; font: 500 15px/1 var(--body); user-select: text; -webkit-user-select: text; }
.admlink { color: var(--dim); font: 600 13px/1 var(--body); padding: 8px 0; align-self: center; }
.bub.them, .gcard.them { align-self: flex-start; }
.bub.them { background: var(--panel2); border-radius: 18px 18px 18px 4px; }
.repbtn { align-self: flex-start; font: 700 12px/1 var(--body); color: #ff6b81; padding: 4px 6px; }
.tab { position: relative; }
.tab.dot::after { content: ""; position: absolute; top: 10px; left: calc(50% + 10px); width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
.bar { padding-right: 200px !important; }
@media (min-width: 560px) { .bar { padding-right: 16px !important; } }
/* ---- sheets ---- */
.sheet {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(0, 0, 0, 0.7);
}
.sheet .card { width: 100%; max-height: 80%; overflow-y: auto; background: var(--panel); border-radius: 26px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.sheet h2 { font: 700 26px/1.05 var(--display); }
.sheet p { font: 500 18px/1.4 var(--body); text-wrap: balance; }
.btn { align-self: stretch; border-radius: 16px; padding: 14px 16px; background: var(--brand); color: #fff; font: 700 15px/1 var(--display);   }
.btn.ghost { background: var(--panel2); }
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--panel2); text-align: left; width: 100%; font: 700 16px/1.2 var(--body); }
.pick .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--a, #fff); }
.pick small { margin-left: auto; color: var(--dim); font: 700 12px/1 var(--body); }

/* ---- panels ---- */
.panel { position: absolute; inset: 0; z-index: 6; overflow-y: auto; background: var(--ink); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.panel > * { flex: none; }
.panel h1 { font: 700 28px/1.05 var(--display); }
.note { font: 500 13px/1.4 var(--body); color: var(--dim); }
.addrow { display: flex; gap: 8px; }
.addrow input, .chatform input { flex: 1; min-width: 0; background: var(--panel2); border: 0; border-radius: 14px; padding: 13px 14px; color: #fff; font: 500 16px/1.2 var(--body); user-select: text; -webkit-user-select: text; }
.addrow input::placeholder, .chatform input::placeholder { color: rgba(255, 255, 255, 0.45); }
.addrow input:focus, .chatform input:focus { outline: 2px solid var(--brand); }
.addrow .btn { align-self: auto; padding: 0 18px; }
.flist { display: flex; flex-direction: column; }
.frow { display: flex; align-items: center; gap: 12px; padding: 12px 2px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.av { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 20px/1 var(--display); color: #000; background: hsl(var(--h, 340), 85%, 62%); }
.frow div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.frow b { font: 700 16px/1.1 var(--body); }
.frow span { font: 500 13px/1.2 var(--body); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 28px 12px; text-align: center; font: 500 15px/1.5 var(--body); color: var(--dim); text-wrap: balance; }

/* chat */
.chathead { display: flex; align-items: center; gap: 10px; }
.chathead .back { width: 40px; height: 40px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; flex: none; }
.chathead svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chathead b { flex: 1; min-width: 0; font: 700 20px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; }
.chathead .rm { font: 700 12px/1 var(--body); color: var(--dim); padding: 10px; }
.msgs { flex: 1 1 auto !important; min-height: 120px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 6px 0; }
.bub { align-self: flex-end; max-width: 80%; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: var(--brand); font: 500 16px/1.35 var(--body); overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.gcard { align-self: flex-end; width: 220px; border-radius: 18px; background: var(--panel2); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.gcard b { font: 700 19px/1.1 var(--display); }
.gcard span { font: 500 13px/1.2 var(--body); color: var(--dim); }
.gcard button { background: #fff; color: #000; border-radius: 12px; padding: 10px; font: 700 13px/1 var(--display);   }
.chatform { display: flex; gap: 8px; align-items: center; }
.chatform .round { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--panel2); font: 700 22px/1 var(--display); }
.chatform .send { background: var(--brand); border-radius: 14px; padding: 0 16px; height: 46px; font: 700 14px/1 var(--display); }
#pChat { padding-bottom: 14px; }

/* profile */
.pf { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; }
.avwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.avedit { font: 700 12px/1 var(--body); color: var(--dim);  }
.pf .avatar { background-size: cover !important; background-position: center !important; overflow: hidden; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font: 700 40px/1 var(--display); color: #000; background: #8a8a8a; }
.pf input { width: 70%; text-align: center; background: transparent; border: 0; border-bottom: 2px solid var(--line); color: #fff; font: 700 22px/1.2 var(--display); padding: 2px 0 4px; user-select: text; -webkit-user-select: text; }
.pf input:focus { outline: none; border-bottom-color: var(--brand); }
.lvlchip { font: 700 12px/1 var(--display);   padding: 7px 12px; border-radius: 999px; background: var(--panel2); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); }
.stat { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: 700 11px/1.2 var(--body);   color: var(--dim); text-align: center; }
.lvlbar { display: flex; flex-direction: column; gap: 6px; }
.lvlbar .track { flex: none; }
.lvlbar .track i { transition: none; }
.lvlbar small { font: 700 12px/1 var(--body); color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
.tabs2 { display: flex; border-bottom: 1px solid var(--line); }
.tabs2 button { flex: 1; padding: 12px 0; font: 700 14px/1 var(--display); color: var(--dim); border-bottom: 3px solid transparent; }
.tabs2 button[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { aspect-ratio: 3 / 4; border-radius: 14px; background: var(--panel); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 10px; text-align: left; border: 1px solid var(--line); }
.tile b { font: 700 15px/1.1 var(--display); }
.toggle { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border-radius: 16px; padding: 14px 16px; font: 700 15px/1 var(--body); width: 100%; }
.toggle em { font: 700 12px/1 var(--display); font-style: normal;   padding: 7px 12px; border-radius: 999px; background: var(--brand); color: #fff; }
.toggle[aria-pressed="false"] em { background: var(--panel2); color: var(--dim); }

/* ---- tab bar ---- */
.bar { display: flex; gap: 6px; flex: none; padding: 6px max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: #000; border-top: 1px solid var(--line); }
.tab { flex: 1; min-height: 44px; border-radius: 14px; color: var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 700 11px/1 var(--body); }
.tab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: #fff; }
.tab[aria-current="page"] svg { fill: #fff; }
@media (prefers-reduced-motion: reduce) { .strip, .toast { animation: none; } .track i { transition: none; } .rail #rLike.pulse svg { animation: none; } }
</style>
</head>
<body>


<div class="app">
  <div class="views" id="views">
    <main class="feed" id="feed" aria-label="Feed de minijuegos"></main>

    <div class="topr" id="topr"><button class="snd" id="sndTop" aria-label="Sonido"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button></div>

    <div class="rail" id="rail">
      <button class="spd" id="spdTop" aria-label="Velocidad x2" aria-pressed="false">2×</button>
      <button id="rLike" aria-label="Me gusta"><svg viewBox="0 0 24 24"><path d="M12 21C12 21 3 15.5 3 9.2C3 6.3 5.2 4.5 7.6 4.5C9.5 4.5 11.1 5.6 12 7.2C12.9 5.6 14.5 4.5 16.4 4.5C18.8 4.5 21 6.3 21 9.2C21 15.5 12 21 12 21Z"/></svg><span>Like</span></button>
      <button id="rSave" aria-label="Guardar"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg><span>Guardar</span></button>
      <button id="rSend" aria-label="Enviar a un amigo"><svg viewBox="0 0 24 24"><path d="M21 3.5L10.5 14M21 3.5l-6.5 17-4-6.5-6.5-4z"/></svg><span>Enviar</span></button>
      <button id="rHelp" aria-label="Cómo se juega"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.1.9-1.1 1.7M12 17h.01"/></svg><span>Cómo</span></button>
    </div>

    <div class="strip" id="strip" hidden>
      <div class="row">
        <div><h3 id="sTitle"></h3><p id="sSub"></p></div>
        <div class="rew"><span>+<span id="sXp">0</span> XP</span><span class="sep">·</span><span class="coin"></span><span>+<span id="sCoin">0</span></span></div>
      </div>
      <div class="xp"><div class="track"><i id="sBar"></i></div><span id="sLvl"></span></div>
      <i class="auto" id="sAuto"></i>
    </div>

    <section class="panel" id="pFriends" hidden aria-label="Amigos">
      <h1>Amigos</h1>
      <form class="addrow" id="addForm"><input id="addIn" maxlength="16" placeholder="Nombre de usuario" autocomplete="off" aria-label="Nombre de usuario del amigo"><button class="btn" type="submit">Agregar</button></form>
      <p class="note" id="addErr">Agregá a tus compañeros por su nombre de usuario.</p>
      <div class="flist" id="flist"></div>
    </section>

    <section class="panel" id="pChat" hidden aria-label="Chat">
      <div class="chathead"><button class="back" id="chatBack" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b id="chatName"></b><button class="rm" id="chatRm">Quitar</button></div>
      <div class="msgs" id="msgs"></div>
      <form class="chatform" id="chatForm"><button class="round" type="button" id="chatGame" aria-label="Enviar un juego">+</button><input id="chatIn" placeholder="Mensaje" maxlength="300" autocomplete="off" aria-label="Mensaje"><button class="send" type="submit">Enviar</button></form>
    </section>

    <section class="panel" id="pProfile" hidden aria-label="Perfil">
      <div class="pf">
        <label class="avwrap"><div class="avatar" id="avatar">J</div><input type="file" id="photoIn" accept="image/*" hidden><span class="avedit">Cambiar foto</span></label>
        <input id="nameIn" maxlength="16" aria-label="Tu nombre" autocomplete="off">
        <span class="lvlchip" id="pLvl">Nivel 1</span>
      </div>
      <div class="stats">
        <div class="stat"><b id="stPlays">0</b><span>Partidas</span></div>
        <div class="stat"><b id="stStreak">1</b><span>Días de racha</span></div>
      </div>
      <div class="lvlbar"><div class="track"><i id="pBar"></i></div><small id="pXp"></small></div>
      <div class="tabs2" role="tablist">
        <button role="tab" id="tabSaved" aria-selected="true">Guardados</button>
        <button role="tab" id="tabLiked" aria-selected="false">Me gusta</button>
      </div>
      <div class="tiles" id="tiles"></div>
      <button class="toggle" id="sndBtn" aria-pressed="true">Sonido <em id="sndState">Sí</em></button>
      <div class="acct" id="acct"></div>
      <div id="adminBox"></div>
    </section>

    <div class="sheet" id="sheet" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="shT">
        <h2 id="shT"></h2><p id="shP"></p><button class="btn" id="shOk">Entendido</button>
      </div>
    </div>
    <div class="sheet" id="sendSheet" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="sdT">
        <h2 id="sdT">Enviar a un amigo</h2><div id="sendList" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn ghost" id="sendCancel">Cancelar</button>
      </div>
    </div>
    <div class="sheet" id="pickSheet" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="pkT">

  /* cuenta: entrar, crear, salir */
  function showLogin() { $("login").hidden = false; paused = true; $("lgErr").textContent = ""; }
  function hideLogin() { $("login").hidden = true; paused = false; }
  function signedIn(d) {
    TOK = d.token || TOK; ME = d.name; ADMIN = !!d.admin; try { localStorage.setItem("sa-token", TOK); } catch (e) {}
    applyState(d.state); hideLogin(); loadFriends(); if (view === "profile") renderProfile(); if (view === "friends") renderFriends();
  }
  function signOut(expired) {
    if (!expired && TOK) { pushState(true); api("logout", { method: "POST" }).catch(function () {}); }
    TOK = null; ME = null; ADMIN = false; FR = []; MS = {}; try { localStorage.removeItem("sa-token"); } catch (e) {}
    badge(); setView("play"); showLogin(); if (expired) $("lgErr").textContent = "Tu sesión venció. Entrá de nuevo.";
  }
  function doAuth(kind) {
    var n = $("lgName").value.trim(), p = $("lgPin").value.trim(), er = $("lgErr"); er.textContent = "";
    if (!n || !p) { er.textContent = "Completá el usuario y el PIN."; return; }
    $("lgIn").disabled = $("lgNew").disabled = true;
    api(kind, { method: "POST", body: { name: n, pin: p } }).then(signedIn).catch(function (x) { er.textContent = x.message; }).then(function () { $("lgIn").disabled = $("lgNew").disabled = false; });
  }
  $("lgForm").addEventListener("submit", function (e) { e.preventDefault(); doAuth("login"); });
  $("lgNew").addEventListener("click", function () { doAuth("register"); });
  $("lgSkip").addEventListener("click", hideLogin);
  function renderAcct() {
    var a = $("acct"), box = $("adminBox"); a.innerHTML = ""; box.innerHTML = "";
    var sp = document.createElement("span"), b = document.createElement("button");
    if (TOK) { sp.textContent = "Cuenta: @" + ME; b.textContent = "Salir"; b.onclick = function () { signOut(false); }; }
    else { sp.textContent = "Sin cuenta"; b.textContent = "Entrar"; b.style.color = "#fff"; b.onclick = showLogin; }
    a.appendChild(sp); a.appendChild(b);
    if (!TOK) return;
    var w = document.createElement("div"); w.className = "adm"; box.appendChild(w);
    if (!ADMIN) {
      var lk = document.createElement("button"); lk.className = "admlink"; lk.textContent = "Soy el administrador"; w.appendChild(lk);
      lk.onclick = function () {
        lk.remove(); var f = document.createElement("form"), inp = document.createElement("input"), go = document.createElement("button"), msg = document.createElement("p");
        inp.placeholder = "Código de administrador"; go.className = "btn"; go.style.alignSelf = "auto"; go.style.padding = "0 16px"; go.textContent = "Activar"; msg.className = "note";
        f.appendChild(inp); f.appendChild(go); w.appendChild(f); w.appendChild(msg);
        f.onsubmit = function (e) { e.preventDefault(); api("admin", { method: "POST", body: { code: inp.value.trim() } }).then(function () { ADMIN = true; renderAcct(); }).catch(function (x) { msg.textContent = x.message; }); };
      };
      return;
    }
    var h = document.createElement("h2"); h.textContent = "Mensajes reportados"; w.appendChild(h);
    var lst = document.createElement("div"); lst.className = "adm"; lst.textContent = "Cargando…"; w.appendChild(lst);
    api("reports").then(function (d) {
      lst.textContent = ""; if (!d.reports.length) { var p = document.createElement("p"); p.className = "note"; p.textContent = "No hay reportes."; lst.appendChild(p); return; }
      d.reports.slice().reverse().forEach(function (r) {
        var c = document.createElement("div"); c.className = "rep";
        var t = document.createElement("div"); t.textContent = r.msg.text || ("Juego: " + (byId[r.msg.game] ? byId[r.msg.game].name : r.msg.game));
        var sm = document.createElement("small"); sm.textContent = "De @" + r.msg.from + " · reportado por @" + r.by;
        var row = document.createElement("div"); row.className = "row";
        var del = document.createElement("button"); del.className = "del"; del.textContent = "Borrar mensaje";
        var ign = document.createElement("button"); ign.textContent = "Descartar";
        del.onclick = function () { api("resolve", { method: "POST", body: { r: r.r, del: true } }).then(function () { c.remove(); }); };
        ign.onclick = function () { api("resolve", { method: "POST", body: { r: r.r, del: false } }).then(function () { c.remove(); }); };
        row.appendChild(del); row.appendChild(ign); c.appendChild(t); c.appendChild(sm); c.appendChild(row); lst.appendChild(c);
      });
    }).catch(function (x) { lst.textContent = x.message; });
  }

  /* profile */
  function paintAv() {
    var a = $("avatar");
    if (P.photo) { a.style.backgroundImage = "url(" + P.photo + ")"; a.textContent = ""; }
    else { a.style.backgroundImage = ""; a.textContent = (P.name.trim()[0] || "J").toUpperCase(); }
  }
  $("photoIn").addEventListener("change", function () {
    var f = this.files && this.files[0]; if (!f) return; var self = this, rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement("canvas"), n = 192, m = Math.min(im.width, im.height); c.width = c.height = n;
        c.getContext("2d").drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n);
        try { P.photo = c.toDataURL("image/jpeg", 0.82); save(); } catch (e) {}
        paintAv(); self.value = "";
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
  function renderProfile() {
    var inf = xpInfo(P.xp);
    $("nameIn").value = ME ? "@" + ME : P.name; $("nameIn").readOnly = !!ME; paintAv(); renderAcct();
    $("pLvl").textContent = "Nivel " + inf.lvl; $("pXp").textContent = inf.rem + " / " + inf.need + " XP";
    $("pBar").style.width = Math.round(inf.rem / inf.need * 100) + "%";
    $("stPlays").textContent = P.plays; $("stStreak").textContent = P.streak;
    $("sndBtn").setAttribute("aria-pressed", String(P.sound)); $("sndState").textContent = P.sound ? "Sí" : "No";
    $("tabSaved").setAttribute("aria-selected", String(profTab === "saved")); $("tabLiked").setAttribute("aria-selected", String(profTab === "liked"));
    var set = profTab === "saved" ? P.saved : P.likes, t = $("tiles"); t.innerHTML = "";
    var ids = CATALOG.filter(function (g) { return set[g.id]; });
    if (!ids.length) { var e = document.createElement("p"); e.className = "empty"; e.style.gridColumn = "1 / -1"; e.textContent = profTab === "saved" ? "Guardá juegos con el marcador del feed y aparecen acá." : "Tocá el corazón en un juego y aparece acá."; t.appendChild(e); return; }
    ids.forEach(function (g) { var b = document.createElement("button"); b.className = "tile"; b.style.setProperty("--a", g.accent); b.innerHTML = "<b>" + esc(g.name) + "</b>"; b.onclick = function () { goTo(g.id); }; t.appendChild(b); });
  }
  $("tabSaved").addEventListener("click", function () { profTab = "saved"; renderProfile(); });
  $("tabLiked").addEventListener("click", function () { profTab = "liked"; renderProfile(); });
  $("nameIn").addEventListener("input", function () { P.name = this.value.slice(0, 16); paintAv(); save(); });
  function sndUI() { $("sndTop").classList.toggle("off", !P.sound); $("sndTop").setAttribute("aria-pressed", String(P.sound)); if (SIL) { if (P.sound) { var pr = SIL.play(); if (pr && pr.catch) pr.catch(function () {}); } else SIL.pause(); } }
  function toggleSound() { P.sound = !P.sound; save(); sndUI(); if (view === "profile") renderProfile(); if (P.sound) { audioUp(); S.perfect(); } }
  $("sndBtn").addEventListener("click", toggleSound);
  $("sndTop").addEventListener("click", function (e) { e.stopPropagation(); toggleSound(); });
  sndUI();
  function spdUI() { $("spdTop").setAttribute("aria-pressed", String(!!P.fast)); }
  $("spdTop").addEventListener("click", function (e) { e.stopPropagation(); P.fast = !P.fast; save(); spdUI(); sfx(P.fast ? 900 : 500, 0.1, "triangle", 0.06); });
  spdUI();

  /* result strip */
  UI.onEnd = function (g) {
    coinsUI(); return;
    var r = g.result, pct = function (x) { return Math.round(x.rem / x.need * 100) + "%"; };
    var near = !g.newBest && g.best > 0 && g.score >= g.best * 0.8;
    $("sTitle").textContent = (g.newBest && g.score > 0) ? "¡Récord nuevo!" : near ? "¡Casi tu récord!" : "Sumaste progreso";
    $("sSub").textContent = g.score + (g.score === 1 ? " punto" : " puntos") + " · mejor " + g.best;
    $("sXp").textContent = r.xp; $("sCoin").textContent = r.coins;
    var bar = $("sBar"), lv = $("sLvl");
    bar.style.transition = "none"; bar.style.width = r.lvlUp ? "0%" : pct(r.before); void bar.offsetWidth; bar.style.transition = ""; bar.style.width = pct(r.after);
    lv.textContent = r.lvlUp ? "¡Nivel " + r.after.lvl + "!" : "Nivel " + r.after.lvl; lv.className = r.lvlUp ? "up" : "";
    coinsUI();
  };

  /* ---------- rail: se esconde mientras jugás ---------- */
  var railEl = $("rail"), railT = 0;
  feed.addEventListener("pointerdown", function () { if (view !== "play") return; railEl.classList.add("busy"); clearTimeout(railT); });
  function railLater() { if (!railEl.classList.contains("busy")) return; clearTimeout(railT); railT = setTimeout(function () { railEl.classList.remove("busy"); }, 1000); }
  window.addEventListener("pointerup", railLater); window.addEventListener("pointercancel", railLater);
  /* ---------- input: tap, drag, hold and swipe ---------- */
  var down = null;
  function local(sec, e) { var r = sec.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function gameOf(sec) { return sec ? cache[+sec.dataset.i] : null; }
  feed.addEventListener("pointerdown", function (e) {
    var sec = e.target.closest(".slide"); down = { id: e.pointerId, x: e.clientX, y: e.clientY, sec: sec };
    if (view !== "play" || paused) return;
    var g = gameOf(sec);
    if (g && (g.ctl === "drag" || g.ctl === "hold") && g.state === "play") { var p = local(sec, e); g.pdown(p.x, p.y); }
  });
  feed.addEventListener("pointermove", function (e) {
    if (!down || down.id !== e.pointerId || !down.sec) return;
    var g = gameOf(down.sec); if (g && g.holding) { var p = local(down.sec, e); g.pmove(p.x, p.y); }
  });
  window.addEventListener("pointercancel", function () {
    if (down && down.sec) { var g = gameOf(down.sec); if (g && g.holding) g.pup(0, 0, true); } down = null;
  });
  window.addEventListener("pointerup", function (e) {
    var d = down; down = null;
    if (!d || d.id !== e.pointerId) return;
    if (AC && AC.state === "suspended") { try { AC.resume(); } catch (er) {} }
    if (view !== "play" || paused || !d.sec) return;
    var g = gameOf(d.sec); if (!g) return;
    var p = local(d.sec, e), dx = e.clientX - d.x, dy = e.clientY - d.y, moved = Math.hypot(dx, dy);
    if (g.state === "over") { if (moved <= 12) g.tap(p.x, p.y); return; }
    if (g.ctl === "drag" || g.ctl === "hold") { g.pup(p.x, p.y, false); return; }
    if (g.ctl === "swipe" && Math.abs(dx) > 40 && Math.abs(dy) < 70) { g.act(dx < 0 ? 1 : g.W - 1, p.y); return; }
    if (moved > 12) return;
    g.tap(p.x, p.y);
  });
  window.addEventListener("keydown", function (e) {
    if (view !== "play" || paused) return;
    var h = feed.clientHeight, g;
    if (e.key === "ArrowDown") { e.preventDefault(); feed.scrollBy({ top: h, behavior: "smooth" }); }
    else if (e.key === "ArrowUp") { e.preventDefault(); feed.scrollBy({ top: -h, behavior: "smooth" }); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); g = activeGame(); if (!g) return; if (g.ctl === "hold" && g.state === "play") { if (!g.holding) g.pdown(g.W / 2, g.H / 2); } else g.tap(g.W / 2, g.H / 2); }
    else if (e.key === "ArrowLeft") { g = activeGame(); if (g) g.tap(1, g.H / 2); }
    else if (e.key === "ArrowRight") { g = activeGame(); if (g) g.tap(g.W - 1, g.H / 2); }
  });
  window.addEventListener("keyup", function (e) { if (e.key === " ") { var g = activeGame(); if (g && g.ctl === "hold") g.pup(0, 0, false); } });
  window.addEventListener("resize", function () { for (var k in cache) { cache[k].resize(); cache[k].reset(); } });

  if (TOK) api("me").then(signedIn).catch(function (x) { if (!TOK) return; }); else showLogin();

  /* ---------- main loop ---------- */
  var last = performance.now(), viewT = 0, saveT = 0;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (view !== "play") { requestAnimationFrame(frame); return; }
    var h = feed.clientHeight || 1, pos = feed.scrollTop / h;
    var lo = Math.floor(pos + 0.001), hi = Math.ceil(pos - 0.001), act = Math.round(pos);
    var vis = lo === hi ? [lo] : [lo, hi], j, g, running = !paused;
    if (act !== lastAct) {
      if (lastAct >= 0 && slides[lastAct]) { var pst = stOf(slides[lastAct].cfg.id), pg = cache[lastAct]; if (viewT < 3 && (!pg || pg.acts === 0)) pst.k++; else if (viewT > 10 && pst.k > 0) pst.k--; }
      lastAct = act; viewT = 0; fillFeed(act); syncRail(); railEl.classList.remove("busy"); save();
    }
    viewT += dt;
    for (j = 0; j < vis.length; j++) {
      g = ensure(vis[j]); if (!g) continue;
      if (vis[j] === act && running) {
        if (g.state === "ready") g.begin();
        if (g.state === "over" && now > g.restartAt) { stOf(g.cfg.id).r++; g.reset(); g.begin(); }
        if (g.state === "play") { stOf(g.cfg.id).t += dt; saveT += dt; if (saveT > 5) { saveT = 0; save(); } }
        g.tick(dt); if (P.fast && g.state === "play") g.tick(dt); g.render(now); g.drawn = true;
      } else if (!g.drawn) { g.render(now); g.drawn = true; }
    }
    for (var k in cache) {
      var kk = +k;
      if (kk < lo || kk > hi) { if (cache[k].state !== "ready") cache[k].reset(); if (Math.abs(kk - act) > 2) drop(kk); }
    }
    var ag = cache[act], show = !!ag && ag.state === "over";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
